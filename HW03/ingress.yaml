apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$3
  name: hw03-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: arch.homework
      http:
        paths:
          - path: /()()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: hw03-service
                port:
                  number: 80
          - path: /otusapp/(.*?)(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: hw03-service
                port:
                  number: 80